{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto px-5 py-16">
  <p class="text-[var(--accent)] text-xs font-bold uppercase tracking-widest mb-4">DawnCMS Docs</p>
  <h1 class="text-3xl md:text-4xl font-bold tracking-tight text-[var(--ink)] mb-3">{{ page_title }}</h1>
  {% if docs_intro %}<p class="text-[var(--muted)] mb-10">{{ docs_intro }}</p>{% endif %}
  <div class="grid gap-4 mt-8">
    {% for d in docs_items %}
    <a href="{{ docs_base }}/docs/{{ d.slug }}" class="group flex gap-5 items-start p-6 rounded-lg ring-1 ring-[var(--hairline-strong)] ring-inset bg-[var(--card)] hover:shadow-md transition-shadow">
      <span class="text-3xl font-bold text-[var(--hairline-strong)] leading-none">{{ d.num }}</span>
      <span class="min-w-0">
        <span class="block text-lg font-semibold text-[var(--ink)] group-hover:text-[var(--accent)] transition-colors">{{ d.title }}</span>
        <span class="block text-sm text-[var(--muted)] mt-1 leading-relaxed">{{ d.desc }}</span>
      </span>
    </a>
    {% endfor %}
  </div>
</div>
{% endblock %}
