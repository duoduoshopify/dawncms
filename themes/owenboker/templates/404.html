{% extends "base.html" %}
{% block content %}
<section class="max-w-[1200px] mx-auto px-5 xl:px-10">
  <div class="min-h-[calc(100vh-10rem)] flex items-center justify-center py-10">
    <div class="flex items-center -translate-y-16">
      <h1 class="font-bold text-2xl sm:text-6xl pr-4 mr-4 sm:pr-7 sm:mr-7 text-[var(--ink)] border-r border-[var(--hairline-strong)]">{{ error_code }}</h1>
      <div>
        <p class="text-sm sm:text-base text-[var(--muted)] mb-4">{% if error_code == 404 %}{{ t('err404_title', error_title) }}{% else %}{{ t('err500_title', error_title) }}{% endif %}</p>
        <a href="/" class="text-sm font-semibold text-[var(--accent)] hover:opacity-80">← {{ t('back_home', '返回首页') }}</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
