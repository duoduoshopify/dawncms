{% set sec_count = (sec.settings.count or '6')|int %}
<div class="mt-14 pt-10 border-t border-[var(--hairline)]">
  <p class="text-sm text-[var(--muted)] mb-6">{{ t('latest_label', '最新') }}</p>
  <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-8">
    {% for p in posts[:sec_count] %}{% include "partials/post_card.html" %}{% endfor %}
  </div>
  {% if pages > 1 %}
  <div class="mt-10">
    <a href="{{ base_url }}2" class="btn-secondary">{{ t('view_all_posts', '浏览全部文章 →') }}</a>
  </div>
  {% endif %}
</div>
