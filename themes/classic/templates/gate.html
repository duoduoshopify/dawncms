{% extends "base.html" %}
{% block content %}
<div class="min-h-screen">
  <div class="max-w-2xl mx-auto px-6 py-24">
    <span class="inline-block px-3 py-1 border border-[var(--accent)]/40 text-[var(--accent)] text-xs font-bold rounded-full mb-6 tracking-widest">{{ t('gate_badge', '会员专享') }}</span>
    <h1 class="ff-serif text-3xl md:text-4xl font-black text-[var(--ink)] mb-5 leading-snug">{{ a.title }}</h1>
    <div class="mb-6">
      <span class="text-[var(--accent)] text-sm mr-3">{{ a.category }}</span>
      <span class="text-[var(--faint)] text-sm">{{ a.date }}</span>
    </div>
    {% if a.desc %}<p class="text-[var(--ink-2)] leading-relaxed mb-8">{{ a.desc }}</p>{% endif %}
    <div class="p-8 rounded-2xl border border-[var(--hairline)] bg-[var(--card)]">
      <p class="ff-serif text-[var(--ink)] font-bold mb-5">{{ t('gate_text', '本文为会员专享内容，登录后可阅读全文。') }}</p>
      <a href="/login?next={{ current_path }}" class="btn-primary mr-4">{{ t('gate_login', '登录阅读') }}</a>
      <a href="/register" class="btn-secondary">{{ t('gate_register', '免费注册') }}</a>
    </div>
  </div>
</div>
{% endblock %}
