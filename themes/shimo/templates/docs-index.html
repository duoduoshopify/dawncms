{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto px-6 py-16">
  <span class="eyebrow block mb-5">DawnCMS Docs</span>
  <h1 class="ff-serif text-3xl md:text-4xl font-black text-[var(--ink)] mb-3">{{ page_title }}</h1>
  {% if docs_intro %}<p class="text-[var(--muted)] mb-10">{{ docs_intro }}</p>{% endif %}
  <div class="grid gap-5 mt-8">
    {% for d in docs_items %}
    <a href="{{ docs_base }}/docs/{{ d.slug }}" class="block group">
      <div class="paper-card rounded-2xl p-6 flex gap-5 items-start">
        <span class="ff-serif text-4xl font-black text-[var(--hairline-strong)]">{{ d.num }}</span>
        <span class="min-w-0">
          <span class="ff-serif block text-xl font-black text-[var(--ink)] group-hover:text-[var(--accent)] transition-colors">{{ d.title }}</span>
          <span class="block text-[var(--ink-2)] text-sm mt-2 leading-relaxed">{{ d.desc }}</span>
        </span>
      </div>
    </a>
    {% endfor %}
  </div>
</div>
{% endblock %}
